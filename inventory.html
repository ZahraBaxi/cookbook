<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory — THE KITCHEN</title>
<meta name="description" content="What's in the kitchen." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav shell" aria-label="Primary">
    <a class="nav-brand" href="index.html" data-site-title>THE KITCHEN</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
    <ul class="nav-links">
      <li><a href="cookbook.html">COOKBOOK</a></li>
      <li><a href="inventory.html" aria-current="page">INVENTORY</a></li>
      <li><a href="groceries.html">GROCERIES</a></li>
      <li><a href="plants.html">PLANTS</a></li>
      <li><a href="admin.html">ADMIN</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="shell">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
      <div>
        <div class="page-header__eyebrow">Pantry, fridge & freezer</div>
        <h1>INVENTORY</h1>
        <p class="page-header__subtitle">What's in the kitchen.</p>
      </div>
      <div>
        <button type="button" class="btn btn--ghost btn--small" id="inventory-unlock-toggle-btn">🔓 UNLOCK TO EDIT</button>
        <button type="button" class="btn btn--ghost btn--small" id="inventory-lock-btn" hidden>🔒 LOCK</button>
      </div>
    </div>

    <div class="toolbar toolbar--secondary" style="align-items:center;">
      <div class="toolbar__label">COPY</div>
      <label class="checkbox-field"><input type="checkbox" id="copy-include-food" checked /><span>Food</span></label>
      <label class="checkbox-field"><input type="checkbox" id="copy-include-appliances" checked /><span>Appliances</span></label>
      <button type="button" class="btn btn--ghost btn--small" id="copy-inventory-btn">COPY</button>
    </div>

    <div class="admin-tabs" role="tablist" style="margin:1rem 0 0;">
      <button class="admin-tab" role="tab" id="tab-inv-food" aria-selected="true" aria-controls="panel-inv-food">FOOD</button>
      <button class="admin-tab" role="tab" id="tab-inv-appliances" aria-selected="false" aria-controls="panel-inv-appliances">APPLIANCES</button>
    </div>
  </div>

  <div id="panel-inv-food" role="tabpanel" aria-labelledby="tab-inv-food">
    <div class="shell" style="padding:0;">
      <div class="summary-strip" id="summary-strip"></div>
    </div>

    <div class="shell">
      <div class="mini-map-section">
        <div class="page-header__eyebrow" style="margin-bottom:0.75rem;">Tap a shelf to see what's there</div>
        <div class="mini-map-section__locations" id="mini-map-locations"></div>
      </div>

      <div class="toolbar">
        <div class="search-field">
          <label for="inventory-search" class="visually-hidden">Search inventory</label>
          <input type="search" id="inventory-search" placeholder="Search inventory..." autocomplete="off" />
        </div>
        <div class="filter-row" id="location-filter-row" role="group" aria-label="Filter by location"></div>
      </div>

      <div id="inventory-results" aria-live="polite">
        <div class="loading-row">Loading inventory from back4app…</div>
      </div>
    </div>
  </div>

  <div id="panel-inv-appliances" role="tabpanel" aria-labelledby="tab-inv-appliances" hidden>
    <div class="shell">
      <div class="toolbar">
        <div class="search-field">
          <label for="appliance-search" class="visually-hidden">Search appliances</label>
          <input type="search" id="appliance-search" placeholder="Search appliances..." autocomplete="off" />
        </div>
      </div>

      <div id="appliance-results" aria-live="polite">
        <div class="loading-row">Loading…</div>
      </div>
    </div>
  </div>
</main>

<!-- PIN modal — opened by "Unlock to edit". Browsing/searching never needs this. -->
<div class="modal-overlay" id="inventory-pin-modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="inventory-pin-modal-title" style="max-width:340px;">
    <button class="modal__close" id="inventory-pin-modal-close" aria-label="Close">&times;</button>
    <h2 id="inventory-pin-modal-title">Unlock to edit</h2>
    <form id="inventory-pin-form" novalidate>
      <div class="field" style="margin-bottom:1rem;">
        <label for="inventory-pin-input" class="visually-hidden">PIN</label>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="inventory-pin-input" autocomplete="off" placeholder="PIN" style="letter-spacing:0.4em; font-size:1.4rem; text-align:center;" />
      </div>
      <p class="admin-error" id="inventory-pin-error" role="alert">Incorrect PIN.</p>
      <div class="form-actions">
        <button type="submit" class="btn btn--primary" style="width:100%;">UNLOCK</button>
      </div>
    </form>
  </div>
</div>

<!-- Quick-edit modal — quantity/level/location/shelf, or mark finished. Deliberately
     narrower than the full Admin item form: this is for a fast shelf-side fix. -->
<div class="modal-overlay" id="quick-edit-modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="quick-edit-modal-title">
    <button class="modal__close" id="quick-edit-modal-close" aria-label="Close">&times;</button>
    <h2 id="quick-edit-modal-title">Quick edit</h2>
    <form id="quick-edit-form" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="quick-edit-quantity">Quantity</label>
          <input type="number" id="quick-edit-quantity" min="0" step="0.1" />
        </div>
        <div class="field">
          <label for="quick-edit-unit">Unit</label>
          <input type="text" id="quick-edit-unit" placeholder="bottle, g, cup…" />
        </div>
        <div class="field field--full">
          <label>Level</label>
          <div class="level-selector" id="quick-edit-level-selector"></div>
        </div>
        <div class="field">
          <label for="quick-edit-location">Location</label>
          <select id="quick-edit-location"></select>
        </div>
        <div class="field">
          <label for="quick-edit-shelf">Shelf</label>
          <select id="quick-edit-shelf"></select>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn--primary">SAVE</button>
        <button type="button" class="btn btn--danger" id="quick-edit-finished-btn" style="margin-left:auto;">FINISHED (REMOVE)</button>
      </div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="shell" data-site-footer>Zahra's Space.</div>
</footer>

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
<script src="js/config.js"></script>
<script src="js/parse.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage-layout.js"></script>
<script src="js/inventory.js"></script>
</body>
</html>
