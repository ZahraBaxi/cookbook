    <a class="nav-brand" href="index.html" data-site-title>THE KITCHEN</a>

<main>
  <div class="shell">
    <div class="page-header">
      <div class="page-header__eyebrow">Changelog</div>
      <h1>UPDATES</h1>
      <p class="page-header__subtitle">What's changed, version by version.</p>
    </div>

    <div id="updates-list"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="shell" data-site-footer>Zahra's Space.</div>
</footer>

<script src="js/config.js"></script>
<script src="js/changelog.js"></script>
<script src="js/utils.js"></script>
<script>
  document.getElementById("updates-list").innerHTML = CHANGELOG.map(function(entry) {
    var dateLabel = new Date(entry.date + "T00:00:00").toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    var items = entry.changes.map(function(c) { return "<li style=\"margin-bottom:0.4rem;\">" + c + "</li>"; }).join("");
    return "<div class=\"admin-missing-section\"><div class=\"admin-missing-section__title\">" + entry.version + " — " + dateLabel + "</div><ul style=\"padding:1rem 1.5rem 1.25rem;\">" + items + "</ul></div>";
  }).join("");
</script>
