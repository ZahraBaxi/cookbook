<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Groceries — THE KITCHEN</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav shell" aria-label="Primary">
    <a class="nav-brand" href="index.html" data-site-title>THE KITCHEN</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span></span></button>
    <ul class="nav-links">
      <li><a href="cookbook.html">COOKBOOK</a></li>
      <li><a href="inventory.html">INVENTORY</a></li>
      <li><a href="groceries.html" aria-current="page">GROCERIES</a></li>
      <li><a href="admin.html">ADMIN</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="shell">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap;">
      <div>
        <div class="page-header__eyebrow">Shopping list</div>
        <h1>GROCERIES</h1>
      </div>
      <div>
        <button type="button" class="btn btn--ghost btn--small" id="grocery-unlock-toggle-btn">🔓 UNLOCK TO EDIT</button>
        <button type="button" class="btn btn--ghost btn--small" id="grocery-lock-btn" hidden>🔒 LOCK</button>
      </div>
    </div>

    <!-- Inline PIN entry — hidden until "Unlock to edit" is clicked. Anyone can
         see the list below without this; this only unlocks adding/editing. -->
    <form id="grocery-pin-form" class="grocery-pin-inline" hidden novalidate>
      <div class="field" style="max-width:140px;">
        <label for="grocery-pin-input" class="visually-hidden">PIN</label>
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="grocery-pin-input" autocomplete="off" placeholder="PIN" style="letter-spacing:0.4em; font-size:1.2rem; text-align:center;" />
      </div>
      <button type="submit" class="btn btn--primary btn--small">UNLOCK</button>
      <button type="button" class="btn btn--ghost btn--small" id="grocery-pin-cancel-btn">CANCEL</button>
      <p class="admin-error" id="grocery-pin-error" role="alert">Incorrect PIN.</p>
    </form>

    <!-- Read-only view — visible to everyone, no PIN needed. What you'd send
         a family member so they can see what to pick up. -->
    <div id="grocery-readonly-view">
      <div id="grocery-readonly-list">
        <div class="loading-row">Loading…</div>
      </div>
    </div>

    <!-- Editable view — only shown once unlocked with the PIN. -->
    <div id="grocery-editor-view" hidden>
      <div class="admin-tabs" role="tablist" style="margin-bottom:1.5rem;">
        <button class="admin-tab" role="tab" id="tab-grocery-add" aria-selected="true" aria-controls="panel-grocery-add">ADD TO LIST</button>
        <button class="admin-tab" role="tab" id="tab-grocery-check" aria-selected="false" aria-controls="panel-grocery-check">CHECK OFF</button>
      </div>

      <!-- Add to list -->
      <div id="panel-grocery-add" role="tabpanel" aria-labelledby="tab-grocery-add">
        <form id="grocery-add-form" novalidate>
          <div class="form-grid">
            <div class="field field--full">
              <label for="grocery-item-name">Item</label>
              <input type="text" id="grocery-item-name" name="name" data-autofocus required placeholder="e.g. Heirloom tomatoes" />
            </div>
            <div class="field">
              <label for="grocery-item-category">Category</label>
              <select id="grocery-item-category" name="category"></select>
            </div>
            <div class="field">
              <label for="grocery-item-location">Where to get it</label>
              <select id="grocery-item-location" name="location"></select>
            </div>
            <div class="field field--full" id="grocery-item-bulk-field" hidden>
              <label class="checkbox-field">
                <input type="checkbox" id="grocery-item-bulk" name="bulk" />
                <span>This is in the bulk bin section</span>
              </label>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary" id="grocery-add-submit-btn">ADD TO LIST</button>
            <button type="button" class="btn btn--ghost" id="grocery-add-cancel-edit-btn" hidden>CANCEL</button>
          </div>
        </form>

        <div id="grocery-add-list" style="margin-top:2rem;">
          <div class="loading-row">Loading…</div>
        </div>
      </div>

      <!-- Check off -->
      <div id="panel-grocery-check" role="tabpanel" aria-labelledby="tab-grocery-check" hidden>
        <div class="filter-row" id="grocery-check-location-filter" role="group" aria-label="Filter by location" style="margin-bottom:1.5rem;"></div>
        <div id="grocery-check-list">
          <div class="loading-row">Loading…</div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="shell" data-site-footer>Zahra's Kitchen.</div>
</footer>

<script src="https://unpkg.com/parse/dist/parse.min.js"></script>
<script src="js/config.js"></script>
<script src="js/parse.js"></script>
<script src="js/utils.js"></script>
<script src="js/groceries.js"></script>
</body>
</html>
